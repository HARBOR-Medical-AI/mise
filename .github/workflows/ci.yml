name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  # Production-dependency advisory gate: a high-severity advisory in a
  # shipped dependency fails the PR instead of surfacing during a release
  # review. Dev-only advisories are deliberately out of scope (coverage
  # tooling pins js-yaml 3.x, which has no backported fix). This job can
  # go red on a PR that touched nothing: that is the gate working, and the
  # fix is a dependency bump, not a revert.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11.19.0
      - run: npm audit --omit=dev --audit-level=high
      # Auditing from inside a workspace member is a silent no-op: npm
      # resolves the prefix up to the workspace root and audits the root
      # lockfile again. Copying each nested lockfile out of the workspace
      # tree is what actually audits it.
      - name: Audit nested lockfiles
        run: |
          for pkg in cumin salsa; do
            dir=$(mktemp -d)
            cp "packages/$pkg/package.json" "packages/$pkg/package-lock.json" "$dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # One exact npm version everywhere: lockfile shape drifts not only
      # across npm majors (node 22 ships npm 10, node 24 npm 11) but within
      # a major (11.6 omitted @emnapi optional-dep entries that 11.19
      # requires). The lockfile is maintained with this exact version; bump
      # it here, in the audit job above, and in release.yml, and regenerate
      # the lockfile together.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      # Publish preflight: packs every workspace exactly as a release would,
      # so publish-time rejections (invalid overrides, bin cleanup, missing
      # files) fail this PR instead of the release run. No auth is needed.
      # Between releases every workspace version already exists on the
      # registry, so "cannot publish over" is the expected steady state and
      # only OTHER npm errors fail the job.
      - name: Publish preflight
        run: |
          set +e
          out=$(npm publish --dry-run --workspaces 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            bad=$(grep '^npm error' <<<"$out" | grep -viE 'cannot publish over|A complete log of this run')
            if [ -n "$bad" ]; then exit "$code"; fi
          fi
      - run: npm test
      # Mock-free wire round trip: a real chell RemoteEngine attached to a
      # real in-process CalypsoDaemon (attach, execute, completion, pipes,
      # shell escapes, prompts, local edits). Needs no CUBE or credentials,
      # so it gates every PR; the unit suites mock this boundary, this does
      # not.
      - run: npm run exemplars:build --workspace @fnndsc/chell
      - run: |
          node exemplars/ts/dist/06_wireRoundtrip.js
          node exemplars/ts/dist/standalone/session_wire.js
        working-directory: packages/chell
      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v4
        # Coverage is reported, never a gate: an outage at Codecov (its
        # uploader failing a TLS handshake, 2026-10-05) must not block a
        # release. fail_ci_if_error does not catch the action itself crashing.
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm run lint:tests
      - run: npm run lint:seam
      # Cast ratchet: the repo's `as unknown as` count may only decrease.
      - run: npm run lint:casts
      # Principle checks (docs/principles.adoc). Two are hard checks; two are
      # ratchets that cannot repair what exists but stop it growing.
      - run: npm run lint:kernel
      - run: npm run lint:fond
      - run: npm run lint:trek
      - run: npm run lint:core-deps
      # The core boots over the null backend with no ChRIS package loaded.
      - run: npm run test:core-boot --workspace @fnndsc/brasa
      # stratus: oci-* only inside its OCI driver, no ChRIS package; it boots
      # over the fake cloud and walks the tenancy tree (docs/stratus.adoc).
      - run: npm run lint:stratus-deps
      - run: npm run test:boot --workspace @fnndsc/stratus
      - run: npm run lint:commands
      - run: npm run lint:prompt
      - run: npm run lint:wire
      - run: npm run lint:listings
      # A function's method is a verb, never a preposition (#1227).
      - run: npm run lint:rpn
      - run: npm run lint:changesets
      - run: npm run lint:aegis
      - run: npm run lint:orrery
      - run: npm run lint --if-present
