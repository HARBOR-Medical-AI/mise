name: E2E (live CUBE)

# Live exemplar runs against a real CUBE. Deliberately NOT part of per-PR
# CI: external-service flakiness must never block merges, and the runs
# need credentials. Nightly + on demand; not a required check.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

# Two runs must not race on the fixed PACS fixture: absence at the start of a
# retrieve is what grants the run ownership of the materialized folder.
concurrency:
  group: mise-live-cube-e2e
  cancel-in-progress: false

jobs:
  exemplars:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUBE_URL: ${{ secrets.CUBE_URL }}
      CUBE_USER: ${{ secrets.CUBE_USER }}
      CUBE_PASSWORD: ${{ secrets.CUBE_PASSWORD }}
      # Admin credentials come from FNNDSC organization-level secrets
      # (documented at chrisproject.org/docs/plugins/github_actions): they
      # are the cube.chrisproject.org admin, matching CUBE_URL's instance.
      CUBE_ADMIN_USER: ${{ secrets.CHRISPROJECT_USERNAME }}
      CUBE_ADMIN_PASSWORD: ${{ secrets.CHRISPROJECT_PASSWORD }}
      # Pins the pl-dcm2niix version exemplar 03 runs; the newest build on
      # a CUBE is not always the working one (repo variable, not a secret).
      CUBE_DCM2NIIX_VERSION: ${{ vars.CUBE_DCM2NIIX_VERSION }}
    steps:
      # Missing credentials FAIL the run. This job once skipped green when
      # unconfigured, which read as six weeks of passing nightlies while the
      # live exemplars never executed — silence must not look like success.
      - name: Check credentials
        run: |
          if [ -z "$CUBE_URL" ] || [ -z "$CUBE_USER" ] || [ -z "$CUBE_PASSWORD" ]; then
            echo "::error::CUBE_URL/CUBE_USER/CUBE_PASSWORD secrets are not configured — the live E2E cannot run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same exact npm version as CI and the lockfile (see ci.yml).
      - run: npm install -g npm@11.19.0
      - name: Build
        run: |
          npm ci
          npm run build
          npm run exemplars:build --workspace @fnndsc/chell
      # Exemplars 03, 04, 09, 11 and 12 need PACS fixtures; they self-skip
      # with exit 2 when those are not configured, so a CUBE without a PACS
      # (e.g. the public instance) still runs the rest.
      - name: TS exemplars
        working-directory: packages/chell
        run: |
          node exemplars/ts/dist/01_connect.js
          node exemplars/ts/dist/02_fsRoundtrip.js
          node exemplars/ts/dist/standalone/intent_connect.js
          node exemplars/ts/dist/standalone/intent_fsRoundtrip.js
          node exemplars/ts/dist/standalone/chell_vocabulary.js
          node exemplars/ts/dist/standalone/chell_typed.js
          node exemplars/ts/dist/03_feedDcm2niix.js || [ $? -eq 2 ]
          node exemplars/ts/dist/04_pacsQR.js || [ $? -eq 2 ]
          node exemplars/ts/dist/05_calypsoDaemon.js
          node exemplars/ts/dist/06_wireRoundtrip.js
          node exemplars/ts/dist/09_pacsReplay.js || [ $? -eq 2 ]
          node exemplars/ts/dist/10_pluginModel.js
          node exemplars/ts/dist/11_pacsCohort.js || [ $? -eq 2 ]
          node exemplars/ts/dist/12_ask.js || [ $? -eq 2 ]
          node exemplars/ts/dist/13_browserVerbs.js
      # Residue-free chell scripts only: 20 pulls PACS files that need
      # admin cleanup outside chell, so it stays a manual exemplar.
      - name: chell scripts
        working-directory: packages/chell
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          # The password is never on a command line, which every process on the runner can list: it goes
          # into a private file, the file's name to curl, and the token CUBE answers with to chell on its
          # standard input. chell saves the session, and the scripts below run under it.
          umask 077
          login="$(mktemp)"
          # Gone however this step ends: a write, a request, a parse or a login that fails leaves no password behind.
          trap 'rm -f "$login"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ username: process.env.CUBE_USER, password: process.env.CUBE_PASSWORD }))' "$login"
          curl -sf -H 'content-type: application/json' -d @"$login" "${CUBE_URL}auth-token/" \
            | node -e 'let s = ""; process.stdin.on("data", (c) => { s += c; }).on("end", () => { console.log(JSON.parse(s).token); });' \
            | node dist/index.js "$CUBE_USER@$CUBE_URL" --auth-token-stdin -c version
          node dist/index.js -e -f exemplars/chell/10_fs_roundtrip.chell
          node dist/index.js -e -f exemplars/chell/30_feed_tour.chell
