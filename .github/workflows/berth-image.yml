name: Berth image

# Builds and pushes mise-berth, one ChRIS user's working container (images/mise-berth),
# when its folder or the Node version's source changes on any branch (a branch's image is
# `sha-<commit>`, for a launcher given it as BERTH_IMAGE), on a release, or by hand:
# `make deploy` starts it on main after each publish, so the image holds the calypso and
# chell just published. Every version comes from images/mise-berth/pins.mjs, read at the
# build. Nothing pins the image: the launcher runs `latest`, which follows main alone.

on:
  push:
    branches: ['**']
    paths:
      - 'images/mise-berth/**'
      - 'packages/stratus/src/chris/profiles.ts'
      - '.github/workflows/berth-image.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pins
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node images/mise-berth/pins.mjs | tee pins.env
          {
            echo 'args<<EOF'
            cat pins.env
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # GHCR names are lower case; the repository's owner is the namespace its token can push to.
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mise-berth" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: images/mise-berth
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.pins.outputs.args }}
          tags: |
            ${{ steps.pins.outputs.image }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.pins.outputs.image) || '' }}
      - name: The image pushed
        run: |
          echo "### mise-berth" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.pins.outputs.image }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' pins.env >> "$GITHUB_STEP_SUMMARY"
